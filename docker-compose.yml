version: '3.8'

services:
  postgres-source:
    image: postgres:15
    container_name: postgres-source
    environment:
      POSTGRES_USER: source_user
      POSTGRES_PASSWORD: source_pass
      POSTGRES_DB: source_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-source-data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    networks:
      - data-contract-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_user -d source_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - data-contract-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio-data:/init-data   
      - ./init-scripts/minio/init.sh:/init.sh
    entrypoint: ["/bin/sh", "/init.sh"]
    networks:
      - data-contract-network

  discovery-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: discovery-agent
    environment:
      SOURCE_DB_HOST: postgres-source
      SOURCE_DB_PORT: 5432
      SOURCE_DB_USER: source_user
      SOURCE_DB_PASSWORD: source_pass
      SOURCE_DB_NAME: source_db
      OPENMETADATA_URL: http://openmetadata-server:8585
      OPENMETADATA_TOKEN: ${OPENMETADATA_TOKEN}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: data-contracts
      YANDEX_IAM_TOKEN: ${YANDEX_IAM_TOKEN}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID}
      CURRENT_USER: admin
    ports:
      - "5001:5001"
    depends_on:
      postgres-source:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./discovery_agent:/app/discovery_agent
      - ./templates:/app/templates
    networks:
      - openmetadata-docker_app_net
      - data-contract-network

volumes:
  postgres-source-data:
  minio-data:

networks:
  openmetadata-docker_app_net:
    external: true
  data-contract-network:
    driver: bridge